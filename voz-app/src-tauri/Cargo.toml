[package]
name = "voz-app"
description = "Voz desktop app (Tauri shell over voz-core)."
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["Joel Ulahanna <joelulahanna@gmail.com>"]

# NOTE: not a workspace member yet — needs system deps (see ../../BUILD.md).
# Wired up across milestones M1–M5.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voz-core = { path = "../../voz-core", features = ["engine", "whisper"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
dirs = "5"
ureq = { version = "2", features = ["json"] }

[features]
# Forward GPU backends to voz-core/whisper.cpp.
cuda = ["voz-core/cuda"]
vulkan = ["voz-core/vulkan"]
