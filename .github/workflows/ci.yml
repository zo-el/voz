name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (audio + Tauri; native build lands in M1+)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpipewire-0.3-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            cmake clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (warnings as errors)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p voz-core --features audio --all-targets -- -D warnings
          cargo clippy -p voz-core --features refine --all-targets -- -D warnings
          cargo clippy -p voz-core --features history --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test --workspace
          cargo test -p voz-core --features audio
          cargo test -p voz-core --features refine
          cargo test -p voz-core --features history

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Slow lane (real whisper integration, fuzz, E2E) is added with those layers;
  # see docs/TESTING.md §4.
