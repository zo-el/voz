name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (audio + Tauri; native build lands in M1+)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpipewire-0.3-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            cmake clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (warnings as errors)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p voz-core --features audio --all-targets -- -D warnings
          cargo clippy -p voz-core --features refine --all-targets -- -D warnings
          cargo clippy -p voz-core --features history --all-targets -- -D warnings
          cargo clippy -p voz-core --features engine --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test --workspace
          cargo test -p voz-core --features audio
          cargo test -p voz-core --features refine
          cargo test -p voz-core --features history
          cargo test -p voz-core --features engine

  supply-chain:
    name: cargo-deny (advisories · bans · licenses · sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Slow lane: compiles whisper.cpp and runs the real-transcription integration test
  # against the base.en model + the JFK sample. Heavy (~10 min), so only on main
  # pushes + manual dispatch — not every PR. See docs/TESTING.md §4.
  slow:
    name: slow lane (real whisper)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpipewire-0.3-dev cmake clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the base.en model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/voz/models/ggml-base.en.bin
          key: whisper-base-en-v1
      - name: Fetch model + sample if missing
        run: |
          mkdir -p "$HOME/.local/share/voz/models"
          MODEL="$HOME/.local/share/voz/models/ggml-base.en.bin"
          [ -f "$MODEL" ] || curl -fsSL -o "$MODEL" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          curl -fsSL -o /tmp/jfk.wav \
            https://github.com/ggerganov/whisper.cpp/raw/master/samples/jfk.wav
      - name: Real-transcription integration test
        run: cargo test -p voz-core --features "whisper audio" -- --ignored --nocapture
