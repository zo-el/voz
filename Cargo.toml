# Voz — Cargo workspace
# `voz-core` is pure-Rust and builds/tests with no system deps.
# `voz-app` (Tauri) and the native audio/whisper layers are added in later
# milestones and need system -dev packages (see docs/PLAN.md / BUILD).
[workspace]
resolver = "2"
members = ["voz-core"]
exclude = ["voz-app", "cosmic-applet"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["Joel Ulahanna <joelulahanna@gmail.com>"]
repository = ""

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# `pedantic` is intentionally not enabled workspace-wide yet (it flags many
# benign numeric casts in the DSP code); revisit once the audio layer lands.

[profile.release]
lto = "thin"
strip = true
