[package]
name = "voz-core"
description = "Core engine for Voz: capture, transcribe, attribute, refine, store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Native backends, enabled per milestone:
#   audio   -> capture via PipeWire `pw-record` (runtime) + hound for WAV writing
#   whisper -> whisper-rs / whisper.cpp (cmake, clang; CUDA toolkit for `cuda`)
audio = ["dep:hound"]
whisper = []
cuda = ["whisper"]
vulkan = ["whisper"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
hound = { version = "3", optional = true }

[dev-dependencies]
