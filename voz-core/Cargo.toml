[package]
name = "voz-core"
description = "Core engine for Voz: capture, transcribe, attribute, refine, store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# Native backends, enabled per milestone:
#   audio   -> capture via PipeWire `pw-record` (runtime) + hound for WAV writing
#   whisper -> whisper-rs / whisper.cpp (cmake, clang; CUDA toolkit for `cuda`)
audio = ["dep:hound"]
whisper = ["dep:whisper-rs", "dep:sha2", "dep:ureq"]
cuda = ["whisper", "whisper-rs/cuda"]
vulkan = ["whisper", "whisper-rs/vulkan"]
# refine -> LLM backends. CLI backends (Claude Code / Codex) need only std + a
# process timeout; Ollama / Claude API add an HTTP client + JSON.
refine = ["dep:ureq", "dep:serde_json", "dep:wait-timeout"]
# history -> SQLite search index over saved notes (bundled sqlite; needs a C compiler)
history = ["dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
hound = { version = "3", optional = true }
whisper-rs = { version = "0.16.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
ureq = { version = "2", optional = true, features = ["json"] }
serde_json = { version = "1.0.150", optional = true }
wait-timeout = { version = "0.2.1", optional = true }
rusqlite = { version = "0.40.0", features = ["bundled"], optional = true }

[dev-dependencies]
